spring.application.name=bikes

# ===== Locale =====
spring.web.locale-resolver=fixed
spring.web.locale=pt_BR

# ===== Banco de dados: H2 em memória (padrão) =====
# Funciona sem nenhuma infraestrutura: IDE, mvn test e pipeline de CI.
# Para usar MySQL (docker-compose), ative o perfil "mysql" (application-mysql.properties).
spring.datasource.url=jdbc:h2:mem:dndinventario;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Console web do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# ===== Actuator / Prometheus =====
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
# Tag comum em todas as métricas: {application="bikes"}
management.metrics.tags.application=${spring.application.name}
# Histogramas de latência HTTP (permite histogram_quantile no Grafana)
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ===== Graylog (GELF) - lidos pelo logback-spring.xml =====
# O envio só é ligado com o perfil "graylog" (SPRING_PROFILES_ACTIVE=graylog). Por padrão, só console.
# Sobrescreva por variável de ambiente (no compose: GRAYLOG_HOST=graylog)
graylog.host=${GRAYLOG_HOST:localhost}
graylog.port=${GRAYLOG_PORT:12201}
graylog.protocol=${GRAYLOG_PROTOCOL:udp}
