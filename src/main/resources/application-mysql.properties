# Perfil "mysql": ative com SPRING_PROFILES_ACTIVE=mysql (o docker-compose já faz isso).
# Fora do Docker, o MySQL do compose está exposto em localhost:4406 -> use DB_PORT=4406.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/bikes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:mysql}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
